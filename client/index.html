    <!--  STRUCTURED DATA — WebSite + Organization           -->
    <!-- ═══════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://kampusace.in/#website",
          "url": "https://kampusace.in/",
          "name": "Kampus Ace",
          "description": "KIIT Campus Placement Preparation Hub",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://kampusace.in/company-bank?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "EducationalOrganization",
          "@id": "https://kampusace.in/#organization",
          "name": "Kampus Ace",
          "url": "https://kampusace.in/",
          "logo": "https://kampusace.in/favicon.svg",
          "description": "AI-powered campus placement preparation platform for KIIT University students",
          "sameAs": [],
          "areaServed": {
            "@type": "Place",
            "name": "KIIT University, Bhubaneswar, Odisha, India"
          }
        }
      ]
    }
    </script>
